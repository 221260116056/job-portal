services:
  - type: web
    name: job-application-portal
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: uploads/resumes
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: job-portal-db
    databaseName: job_portal
    user: job_portal_user
